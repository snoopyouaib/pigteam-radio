[platformio]
src_dir = ./src
data_dir = ./data

; -----------------------------------------------------------------------
; [radio_name] (generated by https://trip5.github.io/ehRadio/myoptions/generator.html)
; [url]
; -----------------------------------------------------------------------
; patch_pio_ini_files can automatically patch this file

[ehradio]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs
build_flags =
	-DCORE_DEBUG_LEVEL=0 ; Set to 0 for no debug; saves memory / 5 for full debug (> 0 adds 1s delay after cold boot to ensure serial logs fully visible)
lib_deps =
  ; These libraries are not optional (version numbers here should work but you can try newer/older versions)
  bblanchon/ArduinoJson@^7.4.3
  adafruit/Adafruit GFX Library@^1.12.6
  adafruit/Adafruit BusIO@^1.17.4
  ESP32Async/ESPAsyncWebServer@^3.11.2
  ESP32Async/AsyncTCP@^3.4.10
  marvinroger/AsyncMqttClient@^0.9.0
  trip5/ESPFileUpdater@^1.4.1
  trip5/ehDP@^1.0.0
  jnthas/Improv WiFi Library@^0.0.4
build_src_filter =
  -<*> ; exclude all files by default
  +<../myoptions.h>
  +<main.cpp>
  +<core/*>
  +<displays/*>
  +<locale/*>
  ; additional local libraries can be included in each environment as so:
  ;+<libraries/ES8311_Audio/*> ; for ES8311 Audio
  ;+<libraries/LiquidCrystalI2C/*> ; for LC1602 Display
; These scripts package do pre- and post-steps to make sure SPIFFS gets .gz files for www and an edited font for Wi-Fi signal bars
extra_scripts = pre:builds/platformio_pre_gzip_www.py, post:builds/platformio_post_gzip_www.py

; -----------------------------------------------------------------------
; Optional External Libraries (here to simplify version number updating)
; Add them under lib_deps like: ${library.onebutton}
; -----------------------------------------------------------------------
[library]
onebutton          = mathertel/OneButton@^2.6.2
rotaryencoder      = igorantolic/Ai Esp32 Rotary Encoder@^1.7
irremote           = crankyoldgit/IRremoteESP8266@^2.9.0
neopixel           = adafruit/Adafruit NeoPixel@^1.15.4
rtclib             = adafruit/RTClib@^2.1.4 ; untested
; Displays (may be incomplete, some are local libraries)
gc9a01a            = adafruit/Adafruit GC9A01A@^1.1.0 ; untested - may need to try 1.0.0
ili9341            = adafruit/Adafruit ILI9341@^1.6.2 ; SPI TFT
n5110              = adafruit/Adafruit PCD8544 Nokia 5110 LCD library@^2.0.3 ; untested
sh110x             = adafruit/Adafruit SH110X@^2.1.14 ; OLED
ssd1305            = adafruit/Adafruit SSD1305@^2.2.3 ; untested
ssd1306            = adafruit/Adafruit SSD1306@^2.5.16 ; Tiny OLED
ssd1327            = adafruit/Adafruit SSD1327@^1.0.4 ; untested OLED
st7735             = adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0 ; SPI TFT (Red Board, probably others)
st7789             = ${library.st7735} ; alias
; Touchscreens
tamc_gt911         = tamctec/TAMC_GT911@^1.0.2 ; untested but should be fine
xpt2046            = paulstoffregen/XPT2046_Touchscreen ; only 1 version: 0.0.0-alpha+sha.26b691b2c8

; -----------------------------------------------------------------------
; ESP32-S3 N16R8 (16 Mo flash QIO + 8 Mo PSRAM OCTAL) + PCM5102, avec ecran ILI9341 tactile
; -----------------------------------------------------------------------
[env:ehradio_s3_n16r8]
extends = ehradio
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi   ; flash QIO + PSRAM octal (N16R8)
board_build.flash_mode = qio
board_upload.flash_size = 16MB
monitor_filters = esp32_exception_decoder, default   ; decode les "Guru Meditation" en noms de fonctions/lignes
board_build.partitions = default_16MB.csv   ; si le depot fournit son propre .csv de partitions, utilise-le a la place
build_src_filter =
  ${ehradio.build_src_filter}
  +<libraries/I2S_Audio/*>   ; lib audio I2S locale (classe Audio) pour le PCM5102
build_flags =
  ${ehradio.build_flags}
  -DBOARD_HAS_PSRAM
  ; Port USB "natif" (USB-OTG) utilise pour le moniteur serie ? decommente :
  ;-DARDUINO_USB_CDC_ON_BOOT=1
  ;-DARDUINO_USB_MODE=1
lib_deps =
  ; copie de ${ehradio.lib_deps} SANS trip5/ESPFileUpdater : version corrigee dans lib/ESPFileUpdater
  bblanchon/ArduinoJson@^7.4.3
  adafruit/Adafruit GFX Library@^1.12.6
  adafruit/Adafruit BusIO@^1.17.4
  ESP32Async/ESPAsyncWebServer@^3.11.2
  ESP32Async/AsyncTCP@^3.4.10
  marvinroger/AsyncMqttClient@^0.9.0
  trip5/ehDP@^1.0.0
  jnthas/Improv WiFi Library@^0.0.4
  ; ecrans : ILI9341 + tactile XPT2046, ou OLED SH1106 (choix dans myoptions.h)
  ${library.ili9341}
  ${library.sh110x}
  ; la version du registre PlatformIO est trop ancienne (pas de begin(SPIClass&)) -> version GitHub
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  ; commandes (plus tard) :
  ;${library.onebutton}
  ;${library.rotaryencoder}
  ;${library.irremote}
